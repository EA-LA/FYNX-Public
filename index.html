<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Shared FYNX profile</title><style>body{max-width:600px;margin:12vh auto;padding:24px;background:#101315;color:#fff;font:18px/1.6 system-ui}a{color:inherit}</style></head><body><h1>Shared FYNX profile</h1><p id="status">Open the full link shared by the member to view a published identity.</p><p><a id="destination" href="https://www.fynxfinanceworld.com/shared-profile.html">Continue to FYNX profiles</a></p><script>
